<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="在三维视窗中调节风速和风向，观察动力气象中的均匀背景流。">
<title>动力气象 · 波动实验室</title>
<style>
:root {
  color-scheme: light;
  --page:#eff4f2; --surface:#fcfefd; --ink:#142b26; --muted:#49635b; --line:#d9e5e0;
  --stage:#f3faf7; --soft:#e4f3ec; --accent:#087653; --solid:#07694a; --on-solid:#fff;
  --grid:#3d796014; --frame:#628c7e; --mesh:#83a99a; --far:#7b9c90; --flow:#14805f; --glow:#43c194; --face:#a8dccc36;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0e1715; --surface:#15221e; --ink:#e9f6ef; --muted:#a7c0b5; --line:#2b4138;
  --stage:#0d1916; --soft:#1e392f; --accent:#83e0bc; --solid:#8be5c2; --on-solid:#10291f;
  --grid:#a9e0cc13; --frame:#7cb6a2; --mesh:#528171; --far:#507969; --flow:#67d8ad; --glow:#7ff0c4; --face:#4a9e7e22;
}
* {box-sizing:border-box}
body {margin:0;background:var(--page);color:var(--ink);font:16px/1.55 system-ui,"Microsoft YaHei","PingFang SC",sans-serif}
button,input {font:inherit}
button {cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible,canvas:focus-visible {outline:2px solid var(--accent);outline-offset:3px}
button:hover {border-color:var(--accent)}
.shell {max-width:1440px;margin:auto;padding:0 clamp(20px,4vw,64px)}
header {background:var(--surface);border-bottom:1px solid var(--line)}
.top {height:72px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand {display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.03em}
.brand-mark {display:grid;place-items:center;width:40px;height:40px;background:var(--solid);color:var(--on-solid);border-radius:12px;font-size:24px}
svg {display:block}
.themes {display:flex;gap:3px;padding:4px;background:var(--page);border:1px solid var(--line);border-radius:999px}
.themes button {display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:999px;background:transparent;padding:5px 11px;font-size:14px}
.themes button[aria-pressed="true"] {background:var(--surface);border-color:var(--line);color:var(--accent)}
.intro {padding:35px 0 23px}
h1,h2,p {margin:0}
h1 {font-size:clamp(33px,4vw,54px);letter-spacing:-.05em;line-height:1.13}
.intro p {color:var(--muted);margin-top:10px}
.workspace {display:grid;grid-template-columns:minmax(0,1fr) 342px;align-items:stretch;gap:18px;padding-bottom:30px}
.card {background:var(--surface);border:1px solid var(--line);border-radius:19px;overflow:hidden}
.bar {display:flex;justify-content:space-between;align-items:center;gap:10px;padding:17px 21px;border-bottom:1px solid var(--line)}
h2 {font-size:19px;letter-spacing:.01em}
.actions {display:flex;gap:7px}
.btn {border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:8px;font-size:14px;white-space:nowrap}
.btn.primary {background:var(--solid);border-color:var(--solid);color:var(--on-solid)}
.viewer {display:flex;flex-direction:column}
.stage {position:relative;min-height:420px;flex:1;background:radial-gradient(ellipse at 48% 45%, var(--soft), transparent 72%),var(--stage)}
.stage::before {position:absolute;inset:0;content:"";background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
canvas {position:absolute;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas:active {cursor:grabbing}
.stage-key {position:absolute;top:17px;left:18px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;pointer-events:none}
.stage-key i {display:block;width:22px;height:2px;background:var(--flow);position:relative}
.stage-key i::after {content:"";position:absolute;right:0;top:-2px;width:5px;height:5px;border-top:2px solid var(--flow);border-right:2px solid var(--flow);transform:rotate(45deg)}
.viewer-foot {display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;padding:12px 19px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.viewer-foot strong {color:var(--accent);font-weight:650}
.controls .bar {justify-content:flex-start}
.settings {padding:17px 19px 18px}
.display-mode {padding:0;margin:0 0 17px;border:0;min-width:0}
.display-mode legend {font-size:15px;font-weight:680;margin-bottom:7px;padding:0}
.mode-options {display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode-options input {position:absolute;width:1px;height:1px;opacity:0}
.mode-options label {text-align:center;cursor:pointer}
.mode-options input:checked + label {border-color:var(--accent);background:var(--soft);color:var(--accent)}
.mode-options input:focus-visible + label {outline:2px solid var(--accent);outline-offset:3px}
.field + .field {margin-top:18px}
.label-row {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.label-row label {font-size:15px;font-weight:680}
.numeric {display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.numeric input {width:76px;border:1px solid var(--line);border-radius:7px;padding:3px 5px;background:var(--page);color:var(--ink);text-align:right;font:600 14px ui-monospace,monospace}
input[type=range] {width:100%;margin:0;display:block;cursor:pointer;accent-color:var(--accent);height:23px}
.ends {display:flex;justify-content:space-between;font:12px/1.5 ui-monospace,monospace;color:var(--muted)}
.presets {display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.presets button[aria-pressed="true"] {color:var(--accent);background:var(--soft);border-color:var(--accent)}
.hint {margin-top:6px;color:var(--muted);font-size:13px}
.readouts {margin-top:16px;padding:11px;background:var(--soft);border-radius:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.metric {padding:2px 4px;text-align:center}
.metric + .metric {border-left:1px solid var(--line)}
.metric span {display:block;color:var(--muted);font-size:13px}
.metric strong {display:block;margin:4px 0 1px;font:700 19px/1.1 ui-monospace,monospace}
.metric small {font-size:12px;color:var(--muted)}
@media(max-width:900px) {.workspace {grid-template-columns:minmax(0,1fr) 300px;gap:12px}}
@media(max-width:760px) {.workspace {grid-template-columns:1fr}.stage {min-height:clamp(320px,67vw,510px)}}
@media(max-width:390px) {.shell {padding-inline:12px}.bar {padding-inline:12px}.themes button {padding-inline:7px}.brand {gap:7px}}
</style>
</head>
<body>
<header><div class="shell top">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 25 25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 8h12c5 0 5-6 1-5M3 12.5h16c4 0 4 5 1 5m-17-1h9c4 0 4 5 1 5"/></svg></span>动力气象 · 波动实验室</div>
  <div class="themes" aria-label="背景主题">
    <button type="button" data-theme-choice="light" aria-pressed="true">☀ 白底</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">☾ 黑底</button>
  </div>
</div></header>
<main class="shell">
  <section class="intro" aria-labelledby="page-title">
    <h1 id="page-title">均匀背景流</h1>
    <p>改变风速和方向，观察长方体中各点共享的速度矢量。</p>
  </section>
  <div class="workspace">
    <section class="card viewer" aria-labelledby="view-title">
      <div class="bar"><h2 id="view-title">三维视窗</h2><div class="actions">
        <button class="btn" type="button" id="reset-view">重置视角</button>
        <button class="btn primary" type="button" id="play">暂停</button>
      </div></div>
      <div class="stage" id="stage">
        <canvas id="view" tabindex="0" aria-label="可旋转的三维均匀流场" aria-describedby="view-help">请使用支持 Canvas 的浏览器查看流场。</canvas>
        <div class="stage-key"><i aria-hidden="true"></i><span id="flow-legend">逐点风矢量</span></div>
      </div>
      <div class="viewer-foot" id="view-help"><span>拖动旋转 · 滚轮缩放 · 方向键旋转</span><strong>x 向东 · y 向北 · z 向上</strong></div>
    </section>
    <aside class="card controls" aria-labelledby="control-title">
      <div class="bar"><h2 id="control-title">流场设置</h2></div>
      <div class="settings">
        <fieldset class="display-mode">
          <legend>风场显示</legend>
          <div class="mode-options">
            <input type="radio" id="show-vectors" name="flow-display" value="vectors" checked>
            <label class="btn" for="show-vectors">逐点风箭头</label>
            <input type="radio" id="show-mean" name="flow-display" value="mean" aria-describedby="mean-note">
            <label class="btn" for="show-mean">平均风场</label>
          </div>
          <p class="hint" id="mean-note" hidden>均匀流场中，空间平均风等于每一点的风。长箭头贯穿长方体，风速请看数值。</p>
        </fieldset>
        <div class="field">
          <div class="label-row"><label for="speed">流速</label><div class="numeric"><input id="speed-number" type="number" min="0" max="50" step="0.1" value="12" aria-label="流速数值，米每秒"><span>m/s</span></div></div>
          <input id="speed" type="range" min="0" max="50" step="0.1" value="12">
          <div class="ends"><span>0</span><span>50 m/s</span></div>
        </div>
        <div class="field">
          <div class="label-row"><label for="direction">风向（来向）</label><div class="numeric"><input id="direction-number" type="number" min="0" max="360" step="1" value="270" aria-label="风向来向角度"><span>°</span></div></div>
          <input id="direction" type="range" min="0" max="360" step="1" value="270">
          <div class="ends"><span>0° 北</span><span>180° 南</span><span>360° 北</span></div>
          <div class="presets" aria-label="常用风向">
            <button class="btn" type="button" data-direction="0" aria-pressed="false">北风</button>
            <button class="btn" type="button" data-direction="90" aria-pressed="false">东风</button>
            <button class="btn" type="button" data-direction="180" aria-pressed="false">南风</button>
            <button class="btn" type="button" data-direction="270" aria-pressed="true">西风</button>
          </div>
          <p class="hint" id="heading-note">270° 从西来，水平吹向东。</p>
        </div>
        <div class="field">
          <div class="label-row"><label for="elevation">流动仰角</label><div class="numeric"><input id="elevation-number" type="number" min="-90" max="90" step="1" value="0" aria-label="流动仰角数值"><span>°</span></div></div>
          <input id="elevation" type="range" min="-90" max="90" step="1" value="0">
          <div class="ends"><span>−90° 向下</span><span>0° 水平</span><span>90° 向上</span></div>
        </div>
        <div class="readouts" aria-label="速度分量，米每秒">
          <div class="metric"><span>东向 u</span><strong id="u">12.00</strong><small>m/s</small></div>
          <div class="metric"><span>北向 v</span><strong id="v">0.00</strong><small>m/s</small></div>
          <div class="metric"><span>垂直 w</span><strong id="w">0.00</strong><small>m/s</small></div>
        </div>
      </div>
    </aside>
  </div>
</main>
<script>
const canvas = document.querySelector('#view');
const ctx = canvas.getContext('2d');
const stage = document.querySelector('#stage');
const play = document.querySelector('#play');
const presets = [...document.querySelectorAll('[data-direction]')];
const themeButtons = [...document.querySelectorAll('[data-theme-choice]')];
const modeInputs = [...document.querySelectorAll('[name="flow-display"]')];
const flowLegend = document.getElementById('flow-legend');
const meanNote = document.getElementById('mean-note');
const defaultView = { yaw: -0.59, tilt: 0.53, zoom: 1 };
const camera = {...defaultView};
const bounds = [4.2, 2.65, 1.5];
const radians = Math.PI / 180;
const state = {speed: 12, direction: 270, elevation: 0, display: 'vectors', running: !matchMedia('(prefers-reduced-motion: reduce)').matches};
let velocity, unit, palette, width, height, drag, previousTime, animation;
let travel = [0, 0, 0];

const corners = [];
for (const z of [-1, 1]) for (const y of [-1, 1]) for (const x of [-1, 1]) corners.push([x*bounds[0], y*bounds[1], z*bounds[2]]);
const faces = [[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]];
const edges = [];
for (let i=0;i<8;i++) for (const bit of [1,2,4]) if (!(i & bit)) edges.push([i,i|bit]);

const lattice = [];
for (const z of [-0.88, 0, 0.88]) {
  for (const y of [-1.65, 0, 1.65]) {
    for (const x of [-3.1,-1.55,0,1.55,3.1]) lattice.push([x,y,z]);
  }
}
const particles = Array.from({length:90}, (_, index) => bounds.map((radius, axis) => {
  const value = (index+1) * [0.754877666,0.569840296,0.438579021][axis];
  return (2*(value % 1)-1)*radius;
}));

function clamp(value, low, high) {return Math.max(low, Math.min(high, value));}
function wrap(value, radius) {return ((value+radius)%(2*radius)+2*radius)%(2*radius)-radius;}

function updateFlow() {
  const direction = state.direction * radians;
  const elevation = state.elevation * radians;
  unit = [-Math.sin(direction)*Math.cos(elevation), -Math.cos(direction)*Math.cos(elevation), Math.sin(elevation)];
  velocity = unit.map(value => value*state.speed);
  for (const [index, name] of ['u','v','w'].entries()) {
    document.getElementById(name).textContent = (Math.abs(velocity[index]) < .005 ? 0 : velocity[index]).toFixed(2);
  }
  for (const button of presets) button.setAttribute('aria-pressed', state.direction%360 === +button.dataset.direction);
  const compass = ['北','东北','东','东南','南','西南','西','西北'];
  const sector = Math.round(state.direction/45)%8;
  const note = document.getElementById('heading-note');
  if (state.speed === 0) note.textContent = '静风 · 三个速度分量均为 0。';
  else if (Math.abs(state.elevation) === 90) note.textContent = '纯垂直流 · 水平分量为 0。';
  else {
    const approx = state.direction%45 ? '约从' : '从';
    const qualifier = state.elevation === 0 ? '吹向' : '水平分量指向';
    note.textContent = `${state.direction}° ${approx}${compass[sector]}来，${qualifier}${compass[(sector+4)%8]}。`;
  }
  draw();
}

function setParameter(name, value) {
  const slider = document.getElementById(name);
  slider.value = clamp(value, +slider.min, +slider.max);
  state[name] = +slider.value;
  document.getElementById(name+'-number').value = slider.value;
  updateFlow();
}
for (const name of ['speed', 'direction', 'elevation']) {
  const slider = document.getElementById(name);
  const input = document.getElementById(name+'-number');
  slider.addEventListener('input', () => setParameter(name,+slider.value));
  input.addEventListener('input', () => {
    if (input.value !== '' && input.validity.valid) {
      slider.value = input.value;
      state[name] = +slider.value;
      updateFlow();
    }
  });
  input.addEventListener('change', () => setParameter(name, input.value === '' ? state[name] : +input.value));
}
for (const button of presets) button.addEventListener('click', () => setParameter('direction',+button.dataset.direction));
function setDisplayMode(mode) {
  state.display = mode;
  const showMean = mode === 'mean';
  flowLegend.textContent = showMean ? '空间平均风矢量' : '逐点风矢量';
  meanNote.hidden = !showMean;
  draw();
}
for (const input of modeInputs) {
  input.addEventListener('change', () => {
    if (input.checked) setDisplayMode(input.value);
  });
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  for (const button of themeButtons) button.setAttribute('aria-pressed', button.dataset.themeChoice === theme);
  const style = getComputedStyle(document.documentElement);
  palette = Object.fromEntries(['frame','mesh','far','flow','glow','face','muted'].map(name => [name, style.getPropertyValue('--'+name).trim()]));
  draw();
}
for (const button of themeButtons) button.addEventListener('click', () => setTheme(button.dataset.themeChoice));

function draw() {
  if (!ctx || !width || !palette || !velocity) return;
  ctx.clearRect(0,0,width,height);
  const cosYaw = Math.cos(camera.yaw);
  const sinYaw = Math.sin(camera.yaw);
  const cosTilt = Math.cos(camera.tilt);
  const sinTilt = Math.sin(camera.tilt);
  const projectedHeight = 2*(Math.abs(sinYaw*sinTilt)*bounds[0]
    + Math.abs(cosYaw*sinTilt)*bounds[1] + cosTilt*bounds[2]);
  const scale = Math.min(width/12.6,height/9.1,(height-70)/projectedHeight)*camera.zoom;
  function project([x,y,z], centerX=width*.5, centerY=height*.49, size=scale) {
    const lateral = x*cosYaw-y*sinYaw;
    const forward = x*sinYaw+y*cosYaw;
    return [centerX+size*lateral, centerY-size*(forward*sinTilt+z*cosTilt), -forward*cosTilt+z*sinTilt];
  }
  function line(a,b,color,thickness=1) {
    ctx.beginPath();
    ctx.moveTo(a[0],a[1]);
    ctx.lineTo(b[0],b[1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = thickness;
    ctx.stroke();
  }
  function arrow(a,b,color,stroke,head) {
    const length = Math.hypot(b[0]-a[0],b[1]-a[1]);
    if (length < 3) {
      ctx.beginPath();
      ctx.arc(b[0],b[1],2,0,Math.PI*2);
      ctx.fillStyle = color;
      ctx.fill();
      return;
    }
    const angle = Math.atan2(b[1]-a[1],b[0]-a[0]);
    const tip = Math.min(head,length*.48);
    line(a,b,color,stroke);
    ctx.beginPath();
    ctx.moveTo(b[0],b[1]);
    for (const offset of [-.51,.51]) ctx.lineTo(b[0]-tip*Math.cos(angle+offset),b[1]-tip*Math.sin(angle+offset));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
  const points = corners.map(point => project(point));
  const orderedFaces = faces.map(face => ({
    face,
    depth: face.reduce((total,index) => total+points[index][2],0)/4
  })).sort((a,b) => a.depth-b.depth);
  const farEdges = new Set();
  for (const {face} of orderedFaces.slice(0,3)) {
    ctx.beginPath();
    for (const [index, corner] of face.entries()) {
      const [x,y] = points[corner];
      if (index === 0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
      const next = face[(index+1)%4];
      farEdges.add(Math.min(corner,next)*8+Math.max(corner,next));
    }
    ctx.closePath();
    ctx.fillStyle = palette.face;
    ctx.fill();
  }
  ctx.globalAlpha = .35;
  for (let i=1;i<8;i++) {
    const x = bounds[0]*(i/4-1);
    line(project([x,-bounds[1],-bounds[2]]),project([x,bounds[1],-bounds[2]]),palette.mesh);
  }
  for (let i=1;i<6;i++) {
    const y = bounds[1]*(i/3-1);
    line(project([-bounds[0],y,-bounds[2]]),project([bounds[0],y,-bounds[2]]),palette.mesh);
  }
  ctx.globalAlpha = .75;
  for (const [a,b] of edges) line(points[a],points[b],palette.far,1);
  ctx.globalAlpha = 1;
  if (state.speed > 0) {
    if (state.display === 'vectors') {
      const arrowLength = .25 + 1.23*Math.sqrt(state.speed/50);
      for (const center of lattice) {
        const start = project(center.map((coord,i) => coord-unit[i]*arrowLength/2));
        const end = project(center.map((coord,i) => coord+unit[i]*arrowLength/2));
        ctx.globalAlpha = .54 + .37*clamp((start[2]+6)/12,0,1);
        arrow(start,end,palette.flow,1.55,7);
      }
    }
    for (const [index, seed] of particles.entries()) {
      const point = seed.map((position,i) => wrap(position+travel[i],bounds[i]));
      const [x,y] = project(point);
      ctx.globalAlpha = .24 + (index%6)*.085;
      ctx.beginPath();
      ctx.arc(x,y,index%5 === 0 ? 2.3 : 1.45,0,Math.PI*2);
      ctx.fillStyle = palette.glow;
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  if (state.display === 'mean' && state.speed > 0) {
    // For a uniform field the spatial mean equals the velocity at every point.
    // Keep both ends just inside the first pair of faces the centerline meets.
    const halfLength = .94 * Math.min(...bounds.map((radius,i) => radius/Math.abs(unit[i])));
    const start = project(unit.map(component => -component*halfLength));
    const end = project(unit.map(component => component*halfLength));
    arrow(start,end,palette.flow,4,16);
  }
  for (const [a,b] of edges) {
    if (!farEdges.has(a*8+b)) line(points[a],points[b],palette.frame,1.45);
  }
  for (const [x,y] of points) {
    ctx.beginPath();
    ctx.arc(x,y,2.1,0,Math.PI*2);
    ctx.fillStyle = palette.frame;
    ctx.fill();
  }
  const origin = [56,height-46];
  const axes = [[1,0,0,'x'],[0,1,0,'y'],[0,0,1,'z']];
  const tips = axes.map(([x,y,z,label]) => ({tip:project([x,y,z],...origin,31),label}));
  tips.sort((a,b) => a.tip[2]-b.tip[2]);
  ctx.font = '600 13px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const {tip,label} of tips) {
    arrow(origin,tip,palette.frame,1.35,6);
    const length = Math.hypot(tip[0]-origin[0],tip[1]-origin[1]);
    if (length < 5) continue;
    ctx.fillStyle = palette.muted;
    ctx.fillText(label,tip[0]+10*(tip[0]-origin[0])/length,tip[1]+10*(tip[1]-origin[1])/length);
  }
}

function resize() {
  width = stage.clientWidth;
  height = stage.clientHeight;
  const density = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = Math.round(width*density);
  canvas.height = Math.round(height*density);
  if (ctx) ctx.setTransform(density,0,0,density,0,0);
  draw();
}
function rotate(horizontal, vertical) {
  camera.yaw += horizontal;
  camera.tilt = clamp(camera.tilt+vertical,-1.48,1.48);
  draw();
}
canvas.addEventListener('pointerdown', event => {
  if (event.button !== 0 || drag) return;
  drag = {id:event.pointerId,x:event.clientX,y:event.clientY};
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  rotate((event.clientX-drag.x)*.009,(event.clientY-drag.y)*.009);
  drag.x = event.clientX;
  drag.y = event.clientY;
});
canvas.addEventListener('lostpointercapture', event => {
  if (drag?.id === event.pointerId) drag = null;
});
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  camera.zoom = clamp(camera.zoom*Math.exp(-event.deltaY*.001),.6,1.8);
  draw();
}, {passive:false});
canvas.addEventListener('keydown', event => {
  const moves = {ArrowLeft:[-.13,0],ArrowRight:[.13,0],ArrowUp:[0,-.13],ArrowDown:[0,.13]};
  if (!moves[event.key]) return;
  event.preventDefault();
  rotate(...moves[event.key]);
});
document.getElementById('reset-view').addEventListener('click', () => {
  Object.assign(camera,defaultView);
  draw();
});

function animate(now) {
  const dt = previousTime === undefined ? 0 : Math.min((now-previousTime)/1000,.05);
  previousTime = now;
  if (state.speed > 0) {
    travel = travel.map((offset,i) => wrap(offset+velocity[i]*dt*.13,bounds[i]));
    draw();
  }
  animation = requestAnimationFrame(animate);
}
function applyPlayback() {
  play.textContent = state.running ? '暂停' : '播放';
  if (state.running) animation = requestAnimationFrame(animate);
  else {
    cancelAnimationFrame(animation);
    previousTime = undefined;
  }
}
play.addEventListener('click', () => {
  state.running = !state.running;
  applyPlayback();
});

setTheme('light');
updateFlow();
setDisplayMode(modeInputs.find(input => input.checked).value);
new ResizeObserver(resize).observe(stage);
resize();
applyPlayback();
</script>
</body>
</html>
