<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UF–UB 突变检验</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:32px 18px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:16px;padding:24px;box-shadow:0 8px 24px #1d355710}
h1{margin:0 0 8px;font-size:28px}p{color:#637083}.drop{border:2px dashed #9bb7e8;border-radius:14px;padding:28px;text-align:center;background:#f8fbff}
button{border:0;border-radius:9px;padding:10px 16px;background:#2864d7;color:white;font-size:15px;cursor:pointer;margin:5px}
button.secondary{background:#e9eef7;color:#28446e}input{display:none}.hint{font-size:13px;color:#768399}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.stat{background:#f6f8fc;border-radius:10px;padding:14px}.stat b{display:block;font-size:20px;margin-top:4px}
canvas{width:100%;height:430px;border:1px solid #edf0f5;border-radius:10px;margin-top:14px}.table-wrap{overflow:auto;max-height:380px;margin-top:18px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #edf0f5;padding:9px 12px;text-align:right;white-space:nowrap}th{background:#f7f9fc;position:sticky;top:0}th:first-child,td:first-child{text-align:left}
#message{margin-top:14px;color:#b42318}.ok{color:#16803c!important}
@media(max-width:650px){.stats{grid-template-columns:1fr}.wrap{padding:18px 10px}}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1>UF–UB 顺序 Mann–Kendall 突变检验</h1>
<p>上传 Excel 后在浏览器本地计算，数据不会上传到服务器。</p>
<div class="drop"><label for="file"><button>选择 Excel 文件</button></label><input id="file" type="file" accept=".xlsx,.xls,.csv"><div class="hint">支持：第一行为表头、第一列时间、第二列数据；也支持横向“日期在列、数据在行”的表格。</div></div>
<div id="message"></div><div id="result" hidden>
<div class="stats"><div class="stat">数据点数<b id="n">—</b></div><div class="stat">趋势判断<b id="trend">—</b></div><div class="stat">首次越过 ±1.96<b id="cross">—</b></div></div>
<button id="download" class="secondary">下载结果 Excel</button><button id="png" class="secondary">下载图像 PNG</button>
<canvas id="chart" width="1000" height="430"></canvas><div class="table-wrap"><table><thead><tr><th>时间</th><th>数据</th><th>UF</th><th>UB</th><th>+1.96</th><th>-1.96</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></section></main>
<script>
const $=id=>document.getElementById(id), file=$('file'); let output=[], labels=[];
file.onchange=()=>{if(file.files[0]) process(file.files[0])};
function readData(rows){if(!rows.length)return [];let h=rows[0].map(x=>String(x??''));let vals=[];
 if(h.length>2&&h.slice(1).some(x=>/日|月|年|时/.test(x))){let r=rows.find(r=>String(r[0]??'').trim()&&r.slice(1).some(v=>typeof v==='number')); if(r) r.slice(1).forEach((v,i)=>{if(Number.isFinite(+v)) vals.push([h[i+1]||String(i+1),+v])})}
 else rows.slice(1).forEach(r=>{if(r.length>=2&&Number.isFinite(+r[1])) vals.push([String(r[0]),+r[1]])}); return vals}
function calc(x){let n=x.length,uf=[0],s=0;for(let k=1;k<n;k++){for(let i=0;i<k;i++)if(x[k][1]>x[i][1])s++;else if(x[k][1]<x[i][1])s--;uf[k]=s/Math.sqrt(k*(k+1)*(2*k+5)/18)}let rev=[...x].reverse(),ubR=[0],sr=0;for(let k=1;k<n;k++){for(let i=0;i<k;i++)if(rev[k][1]>rev[i][1])sr++;else if(rev[k][1]<rev[i][1])sr--;ubR[k]=sr/Math.sqrt(k*(k+1)*(2*k+5)/18)}return {uf,ub:ubR.reverse().map(v=>-v)}}
function process(f){$('message').textContent='正在读取…';let rd=new FileReader();rd.onload=e=>{try{let wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});let data=readData(rows);if(data.length<2)throw Error('未找到至少两行有效数据');let c=calc(data);labels=data.map(d=>d[0]);output=data.map((d,i)=>[d[0],d[1],c.uf[i],c.ub[i],1.96,-1.96]);render();$('message').textContent='处理完成：'+data.length+' 个数据点';$('message').className='ok'}catch(err){$('message').textContent='处理失败：'+err.message}};rd.readAsArrayBuffer(f)}
function render(){$('result').hidden=false;$('n').textContent=output.length;let up=output.findIndex(r=>r[2]>1.96),down=output.findIndex(r=>r[2]<-1.96);$('trend').textContent=output.at(-1)[2]>1.96?'显著上升':output.at(-1)[2]<-1.96?'显著下降':'未达显著';$('cross').textContent=up>=0?labels[up]:down>=0?labels[down]:'未越过';$('rows').innerHTML=output.map(r=>'<tr>'+r.map((v,i)=>'<td>'+ (i<2?v:Number(v).toFixed(4))+'</td>').join('')+'</tr>').join('');draw()}
function draw(){let c=$('chart'),ctx=c.getContext('2d'),w=c.width=c.clientWidth*2,h=c.height=430*2;ctx.scale(2,2);w/=2;h/=2;ctx.clearRect(0,0,w,h);let all=output.flatMap(r=>[r[2],r[3],1.96,-1.96]),min=Math.min(...all)-.3,max=Math.max(...all)+.3,x=i=>45+i*(w-65)/(output.length-1),y=v=>h-35-(v-min)*(h-60)/(max-min);ctx.strokeStyle='#d9e0ea';ctx.setLineDash([3,3]);for(let v of [1.96,-1.96,0]){ctx.beginPath();ctx.moveTo(40,y(v));ctx.lineTo(w-15,y(v));ctx.stroke()}ctx.setLineDash([]);[['#2864d7',2],['#ed7a2f',3]].forEach(([col,idx])=>{ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();output.forEach((r,i)=>i?ctx.lineTo(x(i),y(r[idx])):ctx.moveTo(x(i),y(r[idx])));ctx.stroke()});ctx.fillStyle='#536276';ctx.font='12px sans-serif';ctx.fillText('UF / UB',8,18);ctx.fillText('时间',w-35,h-8)}
$('download').onclick=()=>{let ws=XLSX.utils.aoa_to_sheet([['时间','数据','UF','UB','+1.96','-1.96'],...output]);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'UF-UB');XLSX.writeFile(wb,'UF_UB结果.xlsx')};
$('png').onclick=()=>{let a=document.createElement('a');a.href=$('chart').toDataURL('image/png');a.download='UF_UB图.png';a.click()};
</script></body></html>
